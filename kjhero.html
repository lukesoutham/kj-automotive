<title>KJ Automotive — Hero</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{ --accent:#d9642f; --accent-lt:#f0a15e; }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:#0a0a0b;color:#fff;font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",monospace}
  .track{position:relative;height:340vh;background:#0a0a0b}
  .pin{position:sticky;top:0;height:100svh;overflow:hidden;background:#0a0a0b}
  #eimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform;transform-origin:50% 50%}
  .grade{position:absolute;inset:0;z-index:2;pointer-events:none;background:
    radial-gradient(130% 100% at 50% 42%, transparent 46%, rgba(0,0,0,.4) 82%, rgba(10,10,11,.82) 100%),
    linear-gradient(180deg, rgba(10,10,11,.4) 0%, transparent 26%, rgba(10,10,11,.35) 66%, rgba(10,10,11,.9) 100%)}
  .grain{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.05;background-image:radial-gradient(rgba(255,255,255,.9) .5px,transparent .8px);background-size:3px 3px}
  .nav{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:14px;padding:18px 22px}
  .brand{display:flex;flex-direction:column;line-height:1;margin-right:auto}
  .brand b{font-family:"Fraunces";font-weight:900;font-size:20px;letter-spacing:-.02em}
  .brand span{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.6);margin-top:4px}
  .call{font-weight:700;font-size:14px;text-decoration:none;color:#160b04;background:var(--accent);padding:11px 16px;border-radius:11px}
  .call:hover{background:var(--accent-lt)}
  .hud{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:0 24px clamp(60px,12vh,130px);max-width:820px}
  .step{font-family:"IBM Plex Mono";font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-lt);margin-bottom:12px;display:block;transition:opacity .35s}
  .cap{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(38px,8vw,88px);line-height:.98;letter-spacing:-.025em;text-shadow:0 6px 44px rgba(0,0,0,.7);transition:opacity .35s, transform .35s}
  .cap .hl{color:var(--accent)}
  .sub{font-size:clamp(16px,2.3vw,20px);color:rgba(255,255,255,.9);margin-top:16px;max-width:38ch;text-shadow:0 2px 20px rgba(0,0,0,.7);transition:opacity .35s}
  .rail{position:absolute;left:24px;right:24px;bottom:22px;z-index:5;height:3px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;max-width:340px}
  .rail span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-lt))}
  .cue{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:5;font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.6);white-space:nowrap;animation:c 2.4s ease-in-out infinite}
  @keyframes c{0%,100%{opacity:.4}50%{opacity:.9}}
  .mbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0));background:rgba(10,10,11,.82);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.08)}
  .mbar a{flex:1;text-align:center;font-weight:700;text-decoration:none;padding:14px;border-radius:11px}
  .mbar .p{background:var(--accent);color:#160b04}.mbar .g{border:1px solid rgba(255,255,255,.4);color:#fff}
</style>

<script>
// ---- Zoom stages: ox/oy = focus point (% of image), z = zoom. Tweak freely. ----
const STAGES = [
  { ox:50, oy:44, z:1.06, step:"KJ Automotive",  cap:'Straight to <span class="hl">the problem.</span>', sub:"Real repair in your driveway — across Salem &amp; Utah County." },
  { ox:44, oy:47, z:2.25, step:"01 · Diagnose",  cap:'We find what&#8217;s <span class="hl">actually wrong.</span>', sub:"No guessing. Straight to the fault." },
  { ox:52, oy:78, z:2.55, step:"02 · Repair",    cap:'Right down to <span class="hl">the worn part.</span>', sub:"Real fixes, done on the spot." },
  { ox:46, oy:58, z:1.5,  step:"03 · Done",       cap:'Fixed right — <span class="hl">in your driveway.</span>', sub:"No tow. No waiting room. Call or text." },
];
const img=document.getElementById('eimg'), track=document.getElementById('track');
const stepEl=document.getElementById('step'), capEl=document.getElementById('cap'), subEl=document.getElementById('sub'), rail=document.getElementById('rail'), cue=document.getElementById('cue');
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t);}
let curStage=-1;
function frame(){
  const r=track.getBoundingClientRect(); const total=track.offsetHeight-innerHeight;
  const p=clamp((-r.top)/total,0,0.9999);
  const seg=p*(STAGES.length-1); const i=Math.floor(seg); const f=smooth(seg-i);
  const a=STAGES[i], b=STAGES[Math.min(i+1,STAGES.length-1)];
  const ox=a.ox+(b.ox-a.ox)*f, oy=a.oy+(b.oy-a.oy)*f, z=a.z+(b.z-a.z)*f;
  img.style.transformOrigin=ox+'% '+oy+'%';
  img.style.transform='scale('+z.toFixed(4)+')';
  rail.style.width=(p*100).toFixed(1)+'%';
  cue.style.opacity=(1-smooth(p/0.05)).toFixed(2);
  const active=Math.round(seg);
  if(active!==curStage){ curStage=active; const s=STAGES[active];
    capEl.style.opacity=0; capEl.style.transform='translateY(10px)'; stepEl.style.opacity=0; subEl.style.opacity=0;
    setTimeout(()=>{ stepEl.textContent=s.step; capEl.innerHTML=s.cap; subEl.innerHTML=s.sub;
      capEl.style.opacity=1; capEl.style.transform='none'; stepEl.style.opacity=1; subEl.style.opacity=1; },140);
  }
}
let ticking=false; addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(()=>{ticking=false;frame();});}},{passive:true});
addEventListener('resize',frame);
img.complete?frame():img.addEventListener('load',frame);
frame();
// verification helper: draw each stage crop to a contact sheet
window.__sheet=function(vw,vh){
  const iw=img.naturalWidth, ih=img.naturalHeight;
  const c=document.createElement('canvas'); c.width=vw*STAGES.length; c.height=vh; const ctx=c.getContext('2d');
  STAGES.forEach((s,k)=>{
    const sc=Math.max(vw/iw, vh/ih); let dw=iw*sc, dh=ih*sc, dx=(vw-dw)/2, dy=(vh-dh)/2;
    const Ox=s.ox/100*vw, Oy=s.oy/100*vh;
    const ddx=Ox+s.z*(dx-Ox), ddy=Oy+s.z*(dy-Oy), ddw=dw*s.z, ddh=dh*s.z;
    ctx.save(); ctx.beginPath(); ctx.rect(k*vw,0,vw,vh); ctx.clip();
    ctx.filter='contrast(1.08) saturate(1.04) brightness(0.92)';
    ctx.drawImage(img, k*vw+ddx, ddy, ddw, ddh); ctx.restore();
  });
  return c.toDataURL('image/jpeg',0.5).split(',')[1];
};
</script>
