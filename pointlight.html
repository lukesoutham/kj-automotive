const cv=document.getElementById('gl');
const gl=cv.getContext('webgl',{antialias:false,alpha:false,premultipliedAlpha:false});
const VERT=`attribute vec2 p;varying vec2 vUv;void main(){vUv=vec2(p.x*.5+.5, .5-p.y*.5);gl_Position=vec4(p,0.,1.);}`;
const FRAG=`
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uTexRes;      // image pixel size
uniform float uCA;         // canvas aspect w/h
uniform float uIA;         // image aspect w/h
uniform vec2 uLight;       // light pos in canvas uv (0..1)
uniform float uLift;       // parallax strength
uniform float uTime;
float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
vec2 cover(vec2 uv){
  vec2 s = (uCA>uIA)? vec2(1.0, uIA/uCA) : vec2(uCA/uIA, 1.0);
  return (uv-0.5)*s+0.5;
}
void main(){
  vec2 base=cover(vUv);
  // depth proxy: blurred luminance (few taps)
  vec2 tx=1.0/uTexRes;
  float c0=lum(texture2D(uTex,base).rgb);
  float depth=c0;
  // parallax offset by light/cursor direction, scaled by depth
  vec2 dir=(uLight-0.5);
  vec2 uv=base + dir*depth*uLift;
  vec3 col=texture2D(uTex,uv).rgb;
  // normal from luminance gradient (emboss)
  float lx1=lum(texture2D(uTex,uv+vec2(tx.x,0)).rgb);
  float lx0=lum(texture2D(uTex,uv-vec2(tx.x,0)).rgb);
  float ly1=lum(texture2D(uTex,uv+vec2(0,tx.y)).rgb);
  float ly0=lum(texture2D(uTex,uv-vec2(0,tx.y)).rgb);
  vec3 n=normalize(vec3((lx0-lx1)*3.2,(ly0-ly1)*3.2,0.6));
  // point light in the same cover space
  vec3 lp=vec3(uLight,0.32);
  vec3 L=normalize(vec3(lp.xy-vUv,lp.z));
  float diff=max(dot(n,L),0.0);
  vec3 R=reflect(-L,n);
  float spec=pow(max(R.z,0.0),22.0);
  float d=distance(uLight,vUv);
  float atten=1.0/(1.0+6.0*d*d);
  vec3 warm=vec3(1.0,0.82,0.55);
  vec3 lit=col*(0.30+1.55*diff*atten) + warm*spec*atten*1.5;
  // ambient base so darks aren't pure black
  lit += col*0.12;
  // vignette
  float vig=smoothstep(1.15,0.35,distance(vUv,vec2(0.5)));
  lit*=mix(0.5,1.0,vig);
  gl_FragColor=vec4(lit,1.0);
}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}
const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VERT));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FRAG));gl.linkProgram(prog);gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const pl=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
const U={};['uTexRes','uCA','uIA','uLight','uLift','uTime'].forEach(k=>U[k]=gl.getUniformLocation(prog,k));
const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([20,20,24,255]));
let IA=0.666, IW=733, IH=1100, ready=false;
const img=new Image();
img.onload=()=>{ IW=img.naturalWidth; IH=img.naturalHeight; IA=IW/IH;
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
  ready=true;
};

let W=1,H=1,DPR=Math.min(devicePixelRatio||1,2);
function resize(){const r=cv.getBoundingClientRect();W=Math.max(2,r.width|0);H=Math.max(2,r.height|0);cv.width=W*DPR;cv.height=H*DPR;gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',resize);resize();
let lx=0.5,ly=0.42,tx_=0.5,ty_=0.42,moving=0,last=performance.now();
addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();tx_=(e.clientX-r.left)/r.width;ty_=(e.clientY-r.top)/r.height;moving=1.0;},{passive:true});
addEventListener('deviceorientation',e=>{ if(e.gamma==null)return; tx_=0.5+Math.max(-1,Math.min(1,e.gamma/35))*0.5; ty_=0.5+Math.max(-1,Math.min(1,(e.beta-40)/35))*0.4; moving=1.0;},true);
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;
  // idle auto-drift
  moving=Math.max(0,moving-dt*0.5);
  if(moving<0.05){ tx_=0.5+Math.cos(t*0.0004)*0.28; ty_=0.42+Math.sin(t*0.0005)*0.18; }
  lx+=(tx_-lx)*Math.min(1,dt*6); ly+=(ty_-ly)*Math.min(1,dt*6);
  if(ready){
    gl.useProgram(prog);
    gl.uniform2f(U.uTexRes,IW,IH); gl.uniform1f(U.uCA,W/H); gl.uniform1f(U.uIA,IA);
    gl.uniform2f(U.uLight,lx,ly); gl.uniform1f(U.uLift,0.05); gl.uniform1f(U.uTime,t*0.001);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__diag=()=>{const px=new Uint8Array(4);gl.readPixels((cv.width*0.5)|0,(cv.height*0.5)|0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);return {ready,err:gl.getError(),center:[px[0],px[1],px[2]],W,H};};
