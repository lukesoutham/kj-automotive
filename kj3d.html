<title>KJ Automotive — 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{ --accent:#d9642f; --accent-lt:#f0a15e; }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:#0a0a0b;color:#fff;font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",monospace}
  .track{position:relative;height:340vh;background:#0a0a0b}
  .pin{position:sticky;top:0;height:100svh;overflow:hidden;background:radial-gradient(120% 120% at 50% 30%, #17181c, #0a0a0b 70%)}
  #api-frame{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
  .grade{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(130% 100% at 50% 40%, transparent 55%, rgba(0,0,0,.35) 85%, rgba(10,10,11,.7) 100%)}
  .nav{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:14px;padding:18px 22px;pointer-events:none}
  .nav .brand{display:flex;flex-direction:column;line-height:1;margin-right:auto}
  .brand b{font-family:"Fraunces";font-weight:900;font-size:20px;letter-spacing:-.02em}
  .brand span{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.6);margin-top:4px}
  .call{pointer-events:auto;font-weight:700;font-size:14px;text-decoration:none;color:#160b04;background:var(--accent);padding:11px 16px;border-radius:11px}
  .call:hover{background:var(--accent-lt)}
  .hud{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:0 24px clamp(60px,12vh,130px);max-width:820px;pointer-events:none}
  .step{font-family:"IBM Plex Mono";font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-lt);margin-bottom:12px;display:block;transition:opacity .35s}
  .cap{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(38px,8vw,86px);line-height:.98;letter-spacing:-.025em;text-shadow:0 6px 44px rgba(0,0,0,.8);transition:opacity .35s,transform .35s}
  .cap .hl{color:var(--accent)}
  .sub{font-size:clamp(16px,2.3vw,20px);color:rgba(255,255,255,.9);margin-top:16px;max-width:38ch;text-shadow:0 2px 20px rgba(0,0,0,.8);transition:opacity .35s}
  .rail{position:absolute;left:24px;right:24px;bottom:22px;z-index:5;height:3px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;max-width:340px}
  .rail span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-lt))}
  .cue{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:5;font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.6);white-space:nowrap;animation:c 2.4s ease-in-out infinite}
  @keyframes c{0%,100%{opacity:.4}50%{opacity:.9}}
  .credit{position:absolute;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0));z-index:5;font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.04em;color:rgba(255,255,255,.4)}
  .credit a{color:rgba(255,255,255,.55)}
  .mbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0));background:rgba(10,10,11,.82);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.08)}
  .mbar a{flex:1;text-align:center;font-weight:700;text-decoration:none;padding:14px;border-radius:11px}
  .mbar .p{background:var(--accent);color:#160b04}.mbar .g{border:1px solid rgba(255,255,255,.4);color:#fff}
  .loader{position:fixed;inset:0;z-index:40;background:#0a0a0b;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;transition:opacity .6s}
  .loader.hide{opacity:0;pointer-events:none}
  .spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.18);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ltxt{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55)}
</style>

<div class="track" id="track">
  <div class="pin">
    <iframe id="api-frame" allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>
    <div class="grade"></div>
    <div class="nav"><div class="brand"><b>KJ Automotive</b><span>MOBILE MECHANIC · SALEM UT</span></div><a class="call" href="tel:+18019210293">Call (801) 921-0293</a></div>
    <div class="hud">
      <span class="step mono" id="step">KJ Automotive</span>
      <div class="cap" id="cap">Straight to <span class="hl">the problem.</span></div>
      <div class="sub" id="sub">Real repair in your driveway — across Salem &amp; Utah County.</div>
    </div>
    <div class="rail"><span id="rail"></span></div>
    <div class="cue mono" id="cue">Scroll ↓</div>
    <div class="credit">3D: “F6 Boxer Engine” by <a href="https://sketchfab.com/scudmorello" target="_blank" rel="noopener">Scuderia Morello</a> · CC-BY</div>
  </div>
</div>

<div class="mbar"><a class="p" href="tel:+18019210293">Call (801) 921-0293</a><a class="g" href="sms:+18019210293">Text</a></div>
<div class="loader" id="loader"><div class="spin"></div><div class="ltxt">Loading engine…</div></div>

<script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
<script>
const UID='5700259eeb494b8f8a0b8f63486c59cc';
const STAGES=[
  { az:0.0,  el:0.05, zoom:1.05, step:"KJ Automotive", cap:'Straight to <span class="hl">the problem.</span>', sub:"Real repair in your driveway — across Salem &amp; Utah County." },
  { az:-0.7, el:0.22, zoom:0.62, step:"01 · Diagnose", cap:'We find what&#8217;s <span class="hl">actually wrong.</span>', sub:"No guessing. Straight to the fault." },
  { az:0.8,  el:-0.12,zoom:0.5,  step:"02 · Repair",   cap:'Right down to <span class="hl">the part.</span>', sub:"Real fixes, done on the spot." },
  { az:0.25, el:0.1,  zoom:0.82, step:"03 · Done",     cap:'Fixed right — <span class="hl">in your driveway.</span>', sub:"No tow. No waiting room. Call or text." },
];
const track=document.getElementById('track');
const stepEl=document.getElementById('step'),capEl=document.getElementById('cap'),subEl=document.getElementById('sub'),rail=document.getElementById('rail'),cue=document.getElementById('cue'),loader=document.getElementById('loader');
let API=null, C=null, R=1;  // center, radius
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function rotY(v,a){return [v[0]*Math.cos(a)+v[2]*Math.sin(a), v[1], -v[0]*Math.sin(a)+v[2]*Math.cos(a)];}
let base=[1,0.4,1];
function eyeFor(az,el,zoom){
  let v=rotY(base,az);
  v=[v[0], v[1]+el*R, v[2]];
  const len=Math.hypot(v[0],v[1],v[2])||1;
  const s=(R*zoom)/len;
  return [C[0]+v[0]*s, C[1]+v[1]*s, C[2]+v[2]*s];
}
let curStage=-1, pending=false;
function apply(){
  pending=false;
  const r=track.getBoundingClientRect(), total=Math.max(1, track.offsetHeight-innerHeight);
  let p=(-r.top)/total; if(!isFinite(p))p=0; p=clamp(p,0,0.9999);
  let seg=p*(STAGES.length-1); if(!isFinite(seg))seg=0;
  const i=clamp(Math.floor(seg),0,STAGES.length-2), f=smooth(seg-i);
  const a=STAGES[i], b=STAGES[i+1];
  const az=a.az+(b.az-a.az)*f, el=a.el+(b.el-a.el)*f, zoom=a.zoom+(b.zoom-a.zoom)*f;
  if(API&&C){ API.setCameraLookAt(eyeFor(az,el,zoom), C, 0); }
  rail.style.width=(p*100).toFixed(1)+'%';
  cue.style.opacity=(1-smooth(p/0.05)).toFixed(2);
  const active=Math.round(seg);
  if(active!==curStage){ curStage=active; const s=STAGES[active];
    capEl.style.opacity=0; capEl.style.transform='translateY(10px)'; stepEl.style.opacity=0; subEl.style.opacity=0;
    setTimeout(()=>{ stepEl.textContent=s.step; capEl.innerHTML=s.cap; subEl.innerHTML=s.sub; capEl.style.opacity=1; capEl.style.transform='none'; stepEl.style.opacity=1; subEl.style.opacity=1; },140);
  }
}
function onScroll(){ if(!pending){pending=true; requestAnimationFrame(apply);} }
addEventListener('scroll',onScroll,{passive:true}); addEventListener('resize',onScroll);

const client=new Sketchfab('1.12.1', document.getElementById('api-frame'));
client.init(UID,{
  success:function(api){
    API=api; api.start();
    api.addEventListener('viewerready', function(){
      try{ api.setUserInterfaceVisibility(false); }catch(e){}
      api.getCameraLookAt(function(err, cam){
        if(!err && cam){ C=cam.target.slice ? cam.target : [cam.target[0],cam.target[1],cam.target[2]];
          const eye=cam.position; base=[eye[0]-C[0], eye[1]-C[1], eye[2]-C[2]]; R=Math.hypot(base[0],base[1],base[2])||1; }
        loader.classList.add('hide'); window.__ready=true; try{apply();}catch(e){}
      });
    });
  },
  error:function(){ loader.querySelector('.ltxt').textContent='Could not load 3D'; },
  ui_infos:0, ui_controls:0, ui_stop:0, ui_watermark:0, ui_watermark_link:0, ui_annotations:0,
  ui_help:0, ui_settings:0, ui_vr:0, ui_fullscreen:0, ui_ar:0, ui_hint:0, ui_loading:0,
  scrollwheel:0, autospin:0, autostart:1, preload:1, transparent:0, dnt:1, max_texture_size:2048
});
</script>
