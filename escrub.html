<title>KJ Automotive — Scrub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{ --accent:#d9642f; --accent-lt:#f0a15e; }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:#050506;color:#fff;font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",monospace}
  .escene{position:relative;height:520vh;background:#050506}
  .epin{position:sticky;top:0;height:100svh;overflow:hidden;background:#050506}
  #frame{position:absolute;inset:0;width:100%;height:100%;display:block}
  .grade{position:absolute;inset:0;z-index:2;pointer-events:none;background:
    radial-gradient(120% 90% at 50% 42%, transparent 42%, rgba(0,0,0,.5) 82%, rgba(5,5,6,.9) 100%),
    linear-gradient(180deg, rgba(10,6,3,.35) 0%, transparent 30%, rgba(20,10,4,.35) 72%, rgba(5,5,6,.85) 100%)}
  .warm{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:soft-light;opacity:.5;background:linear-gradient(200deg, rgba(240,161,94,.5), rgba(60,30,10,.2) 60%, rgba(0,0,0,.3))}
  .grain{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.06;background-image:radial-gradient(rgba(255,255,255,.9) .5px,transparent .8px);background-size:3px 3px}
  .nav{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:14px;padding:18px 22px}
  .brand{display:flex;flex-direction:column;line-height:1;margin-right:auto}
  .brand b{font-family:"Fraunces";font-weight:900;font-size:20px;letter-spacing:-.02em}
  .brand span{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.6);margin-top:4px}
  .call{font-weight:700;font-size:14px;text-decoration:none;color:#160b04;background:var(--accent);padding:11px 16px;border-radius:11px}
  .call:hover{background:var(--accent-lt)}
  .overlay{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:0 22px clamp(52px,10vh,110px);max-width:840px}
  .eyebrow{font-family:"IBM Plex Mono";font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-lt)}
  h1{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(42px,8.8vw,98px);line-height:.98;letter-spacing:-.025em;margin:16px 0 0;text-shadow:0 6px 44px rgba(0,0,0,.7)}
  h1 .hl{color:var(--accent)}
  .sub{font-size:clamp(16px,2.3vw,20px);color:rgba(255,255,255,.92);margin:18px 0 0;max-width:40ch;text-shadow:0 2px 20px rgba(0,0,0,.7)}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
  .btn{font-weight:700;font-size:16px;text-decoration:none;border-radius:12px;padding:15px 24px}
  .btn.pri{background:var(--accent);color:#160b04}.btn.pri:hover{background:var(--accent-lt)}
  .btn.gho{border:1px solid rgba(255,255,255,.5);color:#fff}.btn.gho:hover{background:rgba(255,255,255,.1)}
  .rail{position:absolute;left:22px;right:22px;bottom:20px;z-index:5;height:3px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;max-width:360px}
  .rail span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-lt))}
  .cue{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:5;font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.6);white-space:nowrap;animation:c 2.4s ease-in-out infinite}
  @keyframes c{0%,100%{opacity:.4}50%{opacity:.9}}
  .loader{position:fixed;inset:0;z-index:20;background:#050506;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s;color:#fff}
  .loader.hide{opacity:0;pointer-events:none}
  .lbar{width:200px;height:3px;background:rgba(255,255,255,.16);border-radius:999px;overflow:hidden}
  .lbar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .ltxt{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.6)}
</style>

<div class="escene" id="escene">
  <div class="epin">
    <canvas id="frame"></canvas>
    <div class="warm"></div>
    <div class="grade"></div>
    <div class="grain"></div>
    <div class="nav">
      <div class="brand"><b>KJ Automotive</b><span>MOBILE MECHANIC · SALEM UT</span></div>
      <a class="call" href="tel:+18019210293">Call (801) 921-0293</a>
    </div>
    <div class="overlay" id="ov">
      <p class="eyebrow">Salem, Utah · Mobile Auto Repair</p>
      <h1>Straight to <span class="hl">the problem.</span></h1>
      <p class="sub">Real repair in your driveway — scroll to move through the engine.</p>
      <div class="row"><a class="btn pri" href="tel:+18019210293">Get a free quote</a><a class="btn gho" href="sms:+18019210293">Text us</a></div>
    </div>
    <div class="rail"><span id="rail"></span></div>
    <div class="cue mono" id="cue">Scroll to scrub ↓</div>
  </div>
</div>

<div class="loader" id="loader"><div class="ltxt">Warming up the engine…</div><div class="lbar"><span id="lbar"></span></div></div>

<script>
const cv=document.getElementById('frame'), ctx=cv.getContext('2d');
const scene=document.getElementById('escene'), rail=document.getElementById('rail'), ov=document.getElementById('ov'), cue=document.getElementById('cue');
const loader=document.getElementById('loader'), lbar=document.getElementById('lbar');
const N=48; let frames=[], ready=false, DPR=Math.min(devicePixelRatio||1,2), W=1,H=1;
function resize(){const r=cv.getBoundingClientRect();W=r.width|0;H=r.height|0;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);draw(cur);}
addEventListener('resize',resize);
let cur=0;
function draw(i){ if(!frames.length)return; const f=frames[Math.max(0,Math.min(frames.length-1,i))]; if(!f)return;
  const iw=f.width,ih=f.height, s=Math.max(W/iw,H/ih), dw=iw*s,dh=ih*s, dx=(W-dw)/2, dy=(H-dh)/2;
  ctx.filter='contrast(1.12) saturate(1.06) brightness(0.84)';
  ctx.drawImage(f,dx,dy,dw,dh); ctx.filter='none';
}
async function extract(){
  const v=document.createElement('video'); v.src='engine.mp4'; v.muted=true; v.playsInline=true; v.preload='auto';
  await new Promise((res,rej)=>{ v.addEventListener('loadedmetadata',res,{once:true}); v.addEventListener('error',rej,{once:true}); });
  const dur=v.duration||4; const oc=document.createElement('canvas');
  oc.width=960; oc.height=Math.round(960*(v.videoHeight/v.videoWidth)); const octx=oc.getContext('2d');
  for(let i=0;i<N;i++){
    const t=dur*(i/(N-1))*0.98+0.01;
    await new Promise(res=>{ let done=false; const to=setTimeout(()=>{if(!done){done=true;res();}},1500);
      v.addEventListener('seeked',function h(){done=true;clearTimeout(to);v.removeEventListener('seeked',h);res();},{once:true}); v.currentTime=t; });
    octx.drawImage(v,0,0,oc.width,oc.height);
    try{ frames.push(await createImageBitmap(oc)); }catch(e){ const im=new Image(); im.src=oc.toDataURL('image/jpeg',0.8); await new Promise(r=>im.onload=r); frames.push(im); }
    lbar.style.width=Math.round((i+1)/N*100)+'%';
  }
  ready=true; resize(); draw(0); loader.classList.add('hide');
}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function frame(){
  const r=scene.getBoundingClientRect(); const total=scene.offsetHeight-innerHeight;
  const p=clamp((-r.top)/total,0,1);
  const idx=Math.round(p*(frames.length-1));
  if(idx!==cur){ cur=idx; draw(cur); }
  rail.style.width=(p*100).toFixed(1)+'%';
  const introO=1-clamp((p-0.10)/0.12,0,1); ov.style.opacity=introO.toFixed(2); ov.style.transform='translateY('+(-(1-introO)*20).toFixed(0)+'px)';
  cue.style.opacity=(1-clamp(p/0.05,0,1)).toFixed(2);
}
let ticking=false; addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(()=>{ticking=false;frame();});}},{passive:true});
resize(); extract().catch(e=>{ loader.querySelector('.ltxt').textContent='Could not load clip'; });
</script>
